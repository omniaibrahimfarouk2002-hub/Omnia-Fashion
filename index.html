<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnia Fashion | Mansoura</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
function App() {
  const [cart, setCart] = useState({});
  const [filter, setFilter] = useState('All');
  const [search, setSearch] = useState('');
  const [fav, setFav] = useState([]);
  const [name, setName] = useState('');
  const [address, setAddress] = useState('');
  const [promo, setPromo] = useState('');
  const [dark, setDark] = useState(false);

  const products = [
    { id:1, name:"Classic White Dress", cat:"Dresses", price:850, img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400", desc:"Elegant summer dress" },
    { id:2, name:"Denim Jacket", cat:"Jackets", price:750, img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400", desc:"Trendy denim jacket" },
    { id:3, name:"Black Blazer", cat:"Jackets", price:950, img:"https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=400", desc:"Formal blazer" },
    { id:4, name:"Floral Dress", cat:"Dresses", price:650, img:"https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400", desc:"Floral print dress" },
    { id:5, name:"White Sneakers", cat:"Shoes", price:1200, img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400", desc:"Comfortable sneakers" },
    { id:6, name:"Leather Handbag", cat:"Bags", price:900, img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400", desc:"Stylish leather bag" },
  ];

  const filtered = products.filter(m => (filter==='All' || m.cat===filter) && m.name.toLowerCase().includes(search.toLowerCase()));
  const totalItems = Object.values(cart).reduce((a,b)=>a+b,0);
  let subtotal = Object.entries(cart).reduce((sum,[id,qty]) => sum + products.find(m=>m.id==id).price*qty, 0);
  let discount = promo==='OMNIA10' ? subtotal*0.1 : 0;
  let delivery = subtotal>0 ? 50 : 0;
  let total = subtotal - discount + delivery;

  const changeQty = (id, delta) => {
    setCart(prev => {
      let n = {...prev};
      n[id] = (n[id]||0)+delta;
      if(n[id]<=0) delete n[id];
      return n;
    });
  };
  const toggleFav = (id) => setFav(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  const order = () => {
    let msg = `Hello Omnia Fashion - Mansoura%0AName: ${name}%0AAddress: ${address}%0A%0A`;
    Object.entries(cart).forEach(([id,qty])=>{ let it=products.find(m=>m.id==id); msg+=`${it.name} x${qty} = ${it.price*qty} EGP%0A`; });
    msg+=`%0ADiscount: ${discount} - Delivery: ${delivery}%0ATotal: ${total} EGP`;
    window.open(`https://wa.me/201068348772?text=${msg}`,'_blank');
  };

  return (
    <div className={dark ? "min-h-screen bg-gray-900 text-white pb-10" : "min-h-screen bg-pink-50 pb-10"}>
      <div className="bg-pink-600 text-white p-6 text-center rounded-b-3xl">
        <h1 className="text-3xl font-bold">Omnia Fashion 👗</h1>
        <p>Mansoura, Dakahlia | 01068348772</p>
        <button onClick={()=>setDark(!dark)} className="bg-black/20 px-4 py-1 rounded-full mt-2 text-sm">{dark ? "☀️ Light" : "🌙 Dark"}</button>
      </div>

      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search for fashion..." className="block w-[90%] max-w-3xl mx-auto mt-4 p-3 rounded-xl border text-black" />

      <div className="flex gap-2 justify-center mt-3 flex-wrap px-4">
        {['All','Dresses','Jackets','Shoes','Bags'].map(c=>(
          <button key={c} onClick={()=>setFilter(c)} className={filter===c ? "bg-pink-600 text-white px-4 py-2 rounded-full font-bold" : "bg-white text-black px-4 py-2 rounded-full shadow"}>{c}</button>
        ))}
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 max-w-3xl mx-auto">
        {filtered.map(item=>(
          <div key={item.id} className="bg-white text-black rounded-2xl shadow overflow-hidden">
            <img src={item.img} className="w-full h-48 object-cover" />
            <div className="p-4 flex justify-between items-start">
              <div>
                <h2 className="font-bold text-lg">{item.name} <button onClick={()=>toggleFav(item.id)}>{fav.includes(item.id) ? "❤️" : "🤍"}</button></h2>
                <p className="text-gray-500 text-sm">{item.desc}</p>
                <p className="font-bold text-pink-600">{item.price} EGP</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={()=>changeQty(item.id,1)} className="bg-pink-600 text-white w-8 h-8 rounded-full font-bold">+</button>
                <span className="font-bold">{cart[item.id]||0}</span>
                <button onClick={()=>changeQty(item.id,-1)} className="bg-gray-200 w-8 h-8 rounded-full font-bold">-</button>
              </div>
            </div>
          </div>
        ))}
      </div>

      <div className="bg-white text-black p-4 rounded-2xl shadow max-w-3xl mx-auto mx-4 md:mx-auto">
        <h2 className="font-bold text-xl text-center">🛒 Your Cart: {totalItems} item</h2>
        {Object.entries(cart).map(([id,qty])=>{ let it=products.find(m=>m.id==id); return <p key={id} className="text-center text-sm">{it.name} x{qty} = {it.price*qty} EGP <button onClick={()=>changeQty(id,-qty)} className="text-red-500">❌</button></p> })}
        <p className="text-center mt-2">Subtotal: {subtotal} | Discount: {discount} | Delivery: {delivery} | <b>Total: {total} EGP</b></p>
        <input value={promo} onChange={e=>setPromo(e.target.value)} placeholder="Promo code - try OMNIA10" className="w-full border p-3 rounded-xl mt-2" />
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" className="w-full border p-3 rounded-xl mt-2" />
        <input value={address} onChange={e=>setAddress(e.target.value)} placeholder="Your address in Mansoura" className="w-full border p-3 rounded-xl mt-2" />
        <button onClick={order} className="w-full bg-green-500 text-white py-3 rounded-xl font-bold mt-3">Order on WhatsApp 📲 - {total} EGP</button>
      </div>
      <p className="text-center text-xs text-gray-400 mt-8">This is a Demo Project by Omnia Ibrahim - Mansoura, Dakahlia<br/>For Portfolio | WhatsApp: 01068348772</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
